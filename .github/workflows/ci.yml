name: Website CI

on:
  push:
    branches: [main]
    paths-ignore: ["desktop/**", ".github/workflows/desktop-*.yml"]
  pull_request:
    paths-ignore: ["desktop/**", ".github/workflows/desktop-*.yml"]

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test --project=desktop --project=mobile
        env:
          CI: "1"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 30
