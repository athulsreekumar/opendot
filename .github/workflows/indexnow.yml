name: IndexNow

# Vercel's GitHub integration posts a deployment_status event for every deployment. Ping IndexNow only when a
# Production deployment succeeds, so Bing, Yandex, Seznam and Naver learn about changes right away.
on:
  deployment_status:
  workflow_dispatch:

jobs:
  indexnow:
    if: github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/indexnow.mjs
