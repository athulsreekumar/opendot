name: Feature request
description: Suggest an idea for OpenDot
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! Bigger or open-ended ideas are also welcome in [Discussions](https://github.com/athulsreekumar/opendot/discussions).
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Tell us what you're trying to do and what gets in the way today.
      placeholder: I want a Dot that watches a shared Notion page and tells me when a task is assigned to me.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe the behaviour you have in mind. Mockups welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dots and personalities
        - SuperDot
        - Always on and watchers
        - Dot Links (permissions between Dots)
        - Connections (Google, Microsoft, Mac, MCP)
        - Models and providers
        - Privacy and security
        - Design and UX
        - Website
        - Other
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I'd like to help build this.
